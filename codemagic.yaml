workflows:
  ios-unsigned-ipa:
    name: iOS unsigned device IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Prepare project
        script: bash scripts/setup.sh
      - name: Test core
        script: swift test
      - name: Build unsigned iOS app
        script: xcodebuild -project Buie.xcodeproj -scheme Buie -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        script: |
          app_path="build/ios/DerivedData/Build/Products/Release-iphoneos/Buie.app"
          test -d "$app_path"
          mkdir -p build/ios/ipa/Payload
          ditto "$app_path" build/ios/ipa/Payload/Buie.app
          (cd build/ios/ipa && /usr/bin/zip -qr Buie-unsigned.ipa Payload)
    artifacts:
      - build/ios/ipa/Buie-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
  ios-release:
    name: iOS signed release
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events: []
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jonnojohannes.buie
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Prepare project
        script: bash scripts/setup.sh
      - name: Test core
        script: swift test
      - name: Configure signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project Buie.xcodeproj --scheme Buie
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
