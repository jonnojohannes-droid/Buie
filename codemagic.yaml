workflows:
  ios-device-test:
    name: iOS device test IPA (ad hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.jonnojohannes.buie
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Prepare project
        script: bash scripts/setup.sh
      - name: Test core
        script: swift test
      - name: Configure signing
        script: xcode-project use-profiles
      - name: Build device IPA
        script: xcode-project build-ipa --project Buie.xcodeproj --scheme Buie
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
  ios-release:
    name: iOS signed release
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events: []
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jonnojohannes.buie
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Prepare project
        script: bash scripts/setup.sh
      - name: Test core
        script: swift test
      - name: Configure signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project Buie.xcodeproj --scheme Buie
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
