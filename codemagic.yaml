workflows:
  ios-simulator:
    name: iOS simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Prepare project
        script: bash scripts/setup.sh
      - name: Test core
        script: swift test
      - name: Build simulator app
        script: xcodebuild -project Buie.xcodeproj -scheme Buie -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/Buie.app
  ios-release:
    name: iOS signed release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jonnojohannes.buie
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Prepare project
        script: bash scripts/setup.sh
      - name: Test core
        script: swift test
      - name: Configure signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project Buie.xcodeproj --scheme Buie
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
